<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chat application</title>
    <link rel="stylesheet" href="./main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="titl">My chat </div>
    <div class="main">
        <div class="name">
            
            <i class="fa-solid fa-user"></i>
            <input type="text" id="name" class="name" value="anonymouse">
        </div>
        <div class="chat-area">
            <ul class="message-container" id="message-container">
                <li class="message-left">
                    <p class="message">test message</p>
                    <span>me . 25 july 10:30</span>
                </li>

                <li class="message-right">
                    <p class="message">test message</p>
                    <span>me . 25 july 10:30</span>
                </li>
                <li class="message-feedback">
                    <p class="feedback">ali is typing...</p>
                </li>
            </ul>

            <form class="message-form" id="message-form">
                <input type="text" name="message" id="message" class="message-input">
                <div class="v-divider"></div>
                <button type="submit" class="send-btn" >send 
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>
    <h3 class="clients-total" id="clients-total" >total clients :0</h3>


    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="main2.js"></script>
</body>
</html>
