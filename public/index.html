<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chat application</title>
    <link rel="stylesheet" href="./main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="titl">My chat </div>

    <div class="main">
        <aside class="groups-sidebar">
            <h3><i class="fa-solid fa-users"></i> گروه‌های کاری</h3>
            <div class="group-create">
                <input type="text" id="new-group-name" placeholder="نام گروه جدید">
                <button id="create-group-btn"><i class="fa-solid fa-plus"></i> ساخت</button>
            </div>
            <div class="active-group-box">
                <label>گروه فعال:</label>
                <select id="active-group-select">
                    <option value="">گلوبال (عمومی)</option>
                </select>
            </div>
            <ul id="groups-list" class="groups-list"></ul>
        </aside>

        <div class="chat-wrapper">
            <div class="name">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="name" class="name" value="anonymouse">
            </div>

            <div class="chat-area">
                <ul class="message-container" id="message-container"></ul>

                <form class="message-form" id="message-form">
                    <!-- دکمه انتخاب فایل -->
                    <label for="file-input" class="file-btn" title="ارسال فایل">
                        <i class="fa-solid fa-paperclip"></i>
                    </label>
                    <input type="file" id="file-input" hidden>
                    
                    <input type="text" name="message" id="message" class="message-input" placeholder="پیام خود را بنویسید...">
                    <div class="v-divider"></div>
                    <button type="submit" class="send-btn">send
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <h3 class="clients-total" id="clients-total">total clients :0</h3>
    <a class="git-link" href="git@github.com:Zarpoosh/Localhost-Messenger.git">github link :)</a>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="client.js"></script>
</body>
</html>
